name: leaderboard-check

# A pull request that adds or changes a leaderboard entry: each entry is checked (a public repository under an
# OSI-approved licence, not too large, on a known board, with its maintainers' consent, not listed twice) and scored,
# and the preview is uploaded for leaderboard-comment to post on the pull request. This workflow runs the pull
# request's code, so it holds a read-only token and no secrets, and it never comments itself.
on:
  pull_request:
    paths:
      - leaderboard/projects.toml

permissions:
  contents: read

jobs:
  preview:
    name: check and preview the entries
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install PyYAML
        run: python -m pip install --require-hashes -r .github/requirements/test.txt

      - name: Check and score the entries the pull request adds or changes
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.base_ref }}
          NUMBER: ${{ github.event.pull_request.number }}
          VALIDATOR: ${{ github.sha }}
        run: |
          mkdir -p preview
          echo "$NUMBER" > preview/number
          git fetch --quiet --depth 1 origin "$BASE_REF"
          git show "FETCH_HEAD:leaderboard/projects.toml" > "${RUNNER_TEMP}/base.toml" 2> /dev/null || true
          status=0
          python -m leaderboard check --base "${RUNNER_TEMP}/base.toml" --out preview/preview.md \
            --cache "${RUNNER_TEMP}/checkouts" --validator "$VALIDATOR" || status=$?
          cat preview/preview.md >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Upload the preview
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: leaderboard-preview
          path: preview/
          retention-days: 7
