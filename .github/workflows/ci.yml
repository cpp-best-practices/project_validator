name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install ruff
        run: python -m pip install --require-hashes -r .github/requirements/ruff.txt

      - name: Lint
        run: ruff check --output-format=github .

  typing:
    name: typing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install mypy and the project's dependencies
        run: python -m pip install --require-hashes -r .github/requirements/typing.txt

      - name: Type check
        run: mypy

  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.14", "3.x"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python
        with:
          python-version: ${{ matrix.python }}

      - name: Install PyYAML
        run: python -m pip install --require-hashes -r .github/requirements/test.txt

      - name: Test
        run: python -W error -m unittest

  formatting:
    name: formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install ruff
        run: python -m pip install --require-hashes -r .github/requirements/ruff.txt

      - name: Check formatting
        run: ruff format --check --diff .

  copy-paste-detection:
    name: copy-paste detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "lts/*"

      # Pinned by hand: Dependabot does not update versions given to npx.
      - name: Detect duplicated code
        run: npx --yes jscpd@4.3.0

  function-limits:
    name: function limits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install lizard
        run: python -m pip install --require-hashes -r .github/requirements/lizard.txt

      - name: Limit function length
        run: lizard --length 30 --warnings_only project_validator tests

  ci-lint:
    name: ci lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install actionlint and zizmor
        run: python -m pip install --require-hashes -r .github/requirements/ci-lint.txt

      # actionlint checks run: scripts with the runner's shellcheck.
      - name: Lint the workflows
        run: actionlint

      - name: Audit the workflows for security problems
        run: zizmor --format=github .github
        env:
          GH_TOKEN: ${{ github.token }}

  secret-scanning:
    name: secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commits of a push or pull request are scanned, so their history is needed.
          fetch-depth: 0
          persist-credentials: false

      # The action runs the latest TruffleHog image unless told which: pin it to the release's digest. Update it
      # together with the action.
      - name: Scan the new commits for secrets
        uses: trufflesecurity/trufflehog@ea68ca03c865c5f324e86e849ced20ed3cf9dbbb # v3.99.8
        with:
          version: 3.99.8@sha256:674b2f187620a19df77f44cf9a7d77efcc581a5662accef2f2739cbb46ba4a3a
          extra_args: --results=verified,unknown

  self-validation:
    name: self-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install project_validator
        run: python -m pip install .

      # --strict: a warning fails the build, so every check this project is judged by must pass. The grid goes to
      # the job summary first; the strict run decides the step.
      - name: Validate project_validator with itself
        run: |
          project-validator --format markdown --exclude tests/fixtures . >> "$GITHUB_STEP_SUMMARY" || true
          project-validator --strict --exclude tests/fixtures .

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install tools
        run: python -m pip install --require-hashes -r .github/requirements/coverage.txt

      - name: Test with branch coverage
        run: coverage run --branch -m unittest

      - name: Write coverage reports
        run: |
          coverage report --fail-under=0 --format=markdown >> "$GITHUB_STEP_SUMMARY"
          coverage xml --fail-under=0

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Enforce branch coverage threshold
        run: coverage report

  fuzz:
    name: fuzzing
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install atheris
        run: python -m pip install --require-hashes -r .github/requirements/fuzz.txt

      - name: Fuzz yaml
        if: ${{ !cancelled() }}
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python tests/fuzz/fuzz_yaml.py tests/fuzz/corpus/yaml -max_total_time=60 -timeout=25 -rss_limit_mb=2048

      - name: Fuzz cmake
        if: ${{ !cancelled() }}
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python tests/fuzz/fuzz_cmake.py tests/fuzz/corpus/cmake -max_total_time=60 -timeout=25 -rss_limit_mb=2048

      - name: Fuzz meson
        if: ${{ !cancelled() }}
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python tests/fuzz/fuzz_meson.py tests/fuzz/corpus/meson -max_total_time=60 -timeout=25 -rss_limit_mb=2048

      - name: Fuzz shell
        if: ${{ !cancelled() }}
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python tests/fuzz/fuzz_shell.py tests/fuzz/corpus/shell -max_total_time=60 -timeout=25 -rss_limit_mb=2048

      - name: Fuzz github_expressions
        if: ${{ !cancelled() }}
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python tests/fuzz/fuzz_github_expressions.py tests/fuzz/corpus/github_expressions -max_total_time=60 -timeout=25 -rss_limit_mb=2048

      - name: Fuzz json
        if: ${{ !cancelled() }}
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python tests/fuzz/fuzz_json.py tests/fuzz/corpus/json -max_total_time=60 -timeout=25 -rss_limit_mb=2048

      - name: Upload crashes
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashes
          path: |
            crash-*
            leak-*
            timeout-*
            oom-*
          if-no-files-found: ignore
