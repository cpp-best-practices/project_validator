name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.14", "3.x"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: ${{ matrix.python }}

      - name: Install PyYAML
        run: python -m pip install "PyYAML>=6.0"

      - name: Test
        run: python -W error -m unittest

  copy-paste-detection:
    name: copy-paste detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Detect duplicated code
        run: npx --yes jscpd@4 --threshold 0 --format python --reporters console --gitignore project_validator tests

  self-validation:
    name: self-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install project_validator
        run: python -m pip install .

      - name: Validate project_validator with itself
        run: project-validator --exclude tests/fixtures .

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install tools
        run: python -m pip install "coverage>=7.10" "PyYAML>=6.0"

      - name: Test with branch coverage
        run: coverage run --branch -m unittest

      - name: Write coverage reports
        run: |
          coverage report --fail-under=0 --format=markdown >> "$GITHUB_STEP_SUMMARY"
          coverage xml --fail-under=0

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Enforce branch coverage threshold
        run: coverage report
