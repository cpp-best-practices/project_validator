name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.14", "3.x"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: ${{ matrix.python }}

      - name: Install PyYAML
        run: python -m pip install "PyYAML>=6.0"

      - name: Configure
        run: cmake -S . -B build -DPython3_EXECUTABLE="${{ steps.python.outputs.python-path }}"

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Validate this repository
        run: python -m project_validator --build --strict .

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install tools
        run: python -m pip install "coverage>=7.10" "PyYAML>=6.0"

      - name: Test with branch coverage
        run: coverage run --branch -m unittest

      - name: Write coverage reports
        run: |
          coverage report --fail-under=0 --format=markdown >> "$GITHUB_STEP_SUMMARY"
          coverage xml --fail-under=0

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Enforce branch coverage threshold
        run: coverage report
