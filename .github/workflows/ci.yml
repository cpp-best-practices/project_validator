name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install tools
        run: python -m pip install ruff mypy types-PyYAML "PyYAML>=6.0" "rich>=13.0"

      - name: Lint
        run: ruff check --output-format=github .

      - name: Check formatting
        run: ruff format --check --diff .

      - name: Type check
        run: mypy

      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Detect copy-paste
        run: npx --yes jscpd@4

  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.14", "3.x"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: ${{ matrix.python }}

      - name: Install PyYAML
        run: python -m pip install "PyYAML>=6.0"

      - name: Test
        run: python -W error -m unittest

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install tools
        run: python -m pip install "coverage>=7.10" "PyYAML>=6.0"

      - name: Test with branch coverage
        run: coverage run --branch -m unittest

      - name: Write coverage reports
        run: |
          coverage report --fail-under=0 --format=markdown >> "$GITHUB_STEP_SUMMARY"
          coverage xml --fail-under=0

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Enforce branch coverage threshold
        run: coverage report
