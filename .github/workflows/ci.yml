name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }} / ${{ matrix.yaml }} PyYAML
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.14", "3.x"]
        yaml: [with, without]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: ${{ matrix.python }}

      - name: Install PyYAML
        if: matrix.yaml == 'with'
        run: python -m pip install "PyYAML>=6.0"

      - name: Check PyYAML availability matches the matrix
        shell: bash
        run: |
          available=$(python -c "from project_validator import yaml_support; print(yaml_support.available())")
          expected=$([ "${{ matrix.yaml }}" = with ] && echo True || echo False)
          echo "PyYAML available: $available (expected $expected)"
          [ "$available" = "$expected" ]

      - name: Configure
        run: cmake -S . -B build -DPython3_EXECUTABLE="${{ steps.python.outputs.python-path }}"

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Validate this repository
        run: python -m project_validator --build --strict .

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install tools
        run: python -m pip install "coverage>=7.10" "PyYAML>=6.0"

      - name: Test with branch coverage, with PyYAML
        run: coverage run --branch --parallel-mode -m unittest

      - name: Test with branch coverage, without PyYAML
        run: |
          python -m pip uninstall --yes PyYAML
          coverage run --branch --parallel-mode -m unittest

      - name: Combine coverage
        run: coverage combine

      - name: Write coverage reports
        run: |
          coverage report --fail-under=0 --format=markdown >> "$GITHUB_STEP_SUMMARY"
          coverage xml --fail-under=0

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Enforce branch coverage threshold
        run: coverage report
