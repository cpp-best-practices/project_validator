name: dependency audit

# Weekly too: a vulnerability can be published in a dependency without any change here.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install pip-audit
        run: python -m pip install -r .github/requirements/audit.txt

      - name: Audit the project's dependencies
        run: pip-audit --progress-spinner off .

      - name: Audit the tools CI installs
        run: |
          requirements=()
          for file in .github/requirements/*.txt; do requirements+=(-r "$file"); done
          pip-audit --progress-spinner off "${requirements[@]}"
