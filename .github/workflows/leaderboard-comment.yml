name: leaderboard-comment

# Posts leaderboard-check's preview on its pull request, updating the earlier preview comment when there is one.
# This runs in the base repository's context, with permission to comment, so it never checks out or runs the pull
# request's code: it only reads the preview artifact, treats it as text, and comments on the pull request whose
# head is the commit that was checked.
on:
  # The dangerous part of workflow_run is running or trusting the pull request's code; this reads the artifact as
  # text, writes nothing to GITHUB_ENV, takes only digits from it, and checks the pull request's head.
  workflow_run: # zizmor: ignore[dangerous-triggers] the preview is only read as text and commented
    workflows: [leaderboard-check]
    types: [completed]

permissions: {}

jobs:
  comment:
    name: comment the preview
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pull-requests: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: leaderboard-preview
          path: ${{ runner.temp }}/preview
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Post or update the comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          preview="${RUNNER_TEMP}/preview"
          number="$(head -c 20 "${preview}/number" | tr -cd '0-9')"
          if [ -z "$number" ]; then
            echo "::error::the preview names no pull request"
            exit 1
          fi
          # The artifact was written by the pull request's code: comment only on the pull request it claims if that
          # pull request's head is the commit checked.
          head="$(gh api "repos/${REPOSITORY}/pulls/${number}" --jq .head.sha)"
          if [ "$head" != "$HEAD_SHA" ]; then
            echo "::error::pull request ${number} is not at the checked commit"
            exit 1
          fi
          marker='<!-- leaderboard-preview -->'
          { echo "$marker"; tail -n +2 "${preview}/preview.md" | head -c 60000; } > "${RUNNER_TEMP}/body.md"
          existing="$(gh api "repos/${REPOSITORY}/issues/${number}/comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" \
            | head -n 1)"
          if [ -n "$existing" ]; then
            method=PATCH endpoint="repos/${REPOSITORY}/issues/comments/${existing}"
          else
            method=POST endpoint="repos/${REPOSITORY}/issues/${number}/comments"
          fi
          gh api --method "$method" "$endpoint" -F "body=@${RUNNER_TEMP}/body.md" > /dev/null
