name: mutation testing

# On a pull request it mutates the functions the pull request changes and reports the survivors without failing. The
# verdicts are cached between runs, so a push re-tests only what changed; a push to main collects, from nothing, the map
# of tests to functions that a new pull request's first run starts from (a pull request reads its base branch's caches).
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  mutmut:
    name: mutmut
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install mutmut and the tests' dependencies
        run: python -m pip install --require-hashes -r .github/requirements/mutation.txt

      # The verdicts of the newest earlier run (this pull request's, else main's), kept apart from mutants/ until
      # mutmut has made its copy of the tree; tests/mutation_cache.py merges them in.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name == 'pull_request'
        with:
          path: mutation-cache
          key: mutmut-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: mutmut-

      - name: Collect the map of tests to functions
        if: github.event_name == 'push'
        shell: bash
        run: |
          ulimit -v 4194304
          # As below: the first run makes the copy, which then becomes a git repository.
          timeout --signal=INT 5m mutmut run || true
          git -C mutants init -q
          git -C mutants add -A
          # The whole stats pass, always from nothing: on restored stats, print-time-estimates (which generates no
          # mutants) prunes every function from the map of tests to functions and saves it empty.
          mutmut print-time-estimates > /dev/null

      - name: Mutate the functions this pull request changes
        if: github.event_name == 'pull_request'
        # Explicit, so that GitHub adds pipefail: "mutmut run | tee" then fails when mutmut does.
        shell: bash
        env:
          BASE: ${{ github.base_ref }}
        run: |
          # Its own command, so that a failing diff fails the step instead of reading as "nothing changed".
          python tests/changed_mutants.py "origin/$BASE...HEAD" > patterns.txt
          mapfile -t patterns < patterns.txt
          if [ ${#patterns[@]} -eq 0 ]; then
            echo "No function with mutants changed: nothing to mutate." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # A mutant that breaks a loop's progress while it appends grows without bound, faster than mutmut's CPU-time
          # limit stops it (the full run saw 14 GB in minutes): capping each process's address space at 4 GiB makes it
          # fail as a kill instead of exhausting the runner.
          ulimit -v 4194304
          # mutmut copies the tree into mutants/, which is not a git repository, so the tests that call
          # "git ls-files" fail there. The first run only creates the copy (its stats pass stops at the
          # first failures); make the copy a repository, then run for real. The priming run is expected to fail
          # fast in its stats pass, because the copy is not a git repository yet; if that pass ever succeeds, the
          # job runs the named mutants twice.
          timeout --signal=INT 5m mutmut run "${patterns[@]}" || true
          git -C mutants init -q
          git -C mutants add -A
          # Keep the earlier verdicts of functions whose source and tests are unchanged since they were reached.
          python tests/mutation_cache.py restore mutation-cache
          # A budget below the job's timeout: a pull request that changes many functions still gets a report
          # of the mutants checked so far, instead of a cancelled job and no report at all. The budget covers
          # the whole run: the stats pass that maps tests to functions (the full suite, 15 to 20 minutes), the
          # clean run of the tests covering the changed functions (up to the full suite again for a change to
          # a central function), then the mutants at about two seconds each. A pull request that changes a few
          # functions finishes well inside it; one that changes central ones gets the mutants of the fastest
          # tests first.
          budget_minutes=30
          status=0
          timeout --signal=INT --kill-after=2m "${budget_minutes}m" mutmut run "${patterns[@]}" 2>&1 | tee run.log || status=$?
          if grep -q 'Filtered for specific mutants, but nothing matches' run.log; then
            # mutmut asserts when no pattern matches: the changed functions are ones it does not mutate.
            echo "The changed functions have no mutants: nothing to mutate." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # 124 is the budget's end; 137 is the KILL two minutes after it, when mutmut ignored the INT (its stats pass
          # does): both are the budget running out, reported below, not a failure.
          [ "$status" -eq 0 ] || [ "$status" -eq 124 ] || [ "$status" -eq 137 ] || exit "$status"
          # The results also list the other functions' mutants, which the cache keeps: only the changed functions'.
          survivors=$(mktemp)
          mutmut results | python tests/mutation_cache.py survivors patterns.txt | grep -v ': not checked$' > "$survivors" || true
          checked=$(mutmut results --all true | python tests/mutation_cache.py survivors patterns.txt | grep -vc ': not checked$' || true)
          {
            echo '## Mutation testing of the changed functions'
            echo
            echo 'Mutants of: `'"${patterns[*]}"'`'
            echo
            if [ "$status" -ne 0 ]; then
              echo "Stopped after $budget_minutes minutes with $checked mutants checked: the results below cover those."
              echo
            fi
            if [ -s "$survivors" ]; then
              echo '```'
              cat "$survivors"
              echo '```'
            else
              echo 'no survivors'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the verdicts for the next run
        if: always() && hashFiles('mutants/mutmut-stats.json') != ''
        run: python tests/mutation_cache.py save mutation-cache

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always() && hashFiles('mutation-cache/mutmut-stats.json') != ''
        with:
          path: mutation-cache
          key: mutmut-${{ github.run_id }}-${{ github.run_attempt }}
