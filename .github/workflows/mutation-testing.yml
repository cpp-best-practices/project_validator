name: mutation testing

# Pull requests only: it mutates the functions the pull request changes and reports the survivors without failing.
on: pull_request

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  mutmut:
    name: mutmut
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install mutmut and the tests' dependencies
        run: python -m pip install --require-hashes -r .github/requirements/mutation.txt

      - name: Mutate the functions this pull request changes
        env:
          BASE: ${{ github.base_ref }}
        run: |
          # Its own command, so that a failing diff fails the step instead of reading as "nothing changed".
          python tests/changed_mutants.py "origin/$BASE...HEAD" > patterns.txt
          mapfile -t patterns < patterns.txt
          if [ ${#patterns[@]} -eq 0 ]; then
            echo "No function with mutants changed: nothing to mutate." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # mutmut copies the tree into mutants/, which is not a git repository, so the tests that call
          # "git ls-files" fail there. The first run only creates the copy (its stats pass stops at the
          # first failures); make the copy a repository, then run for real. The priming run is expected to fail
          # fast in its stats pass, because the copy is not a git repository yet; if that pass ever succeeds, the
          # job runs the named mutants twice.
          timeout --signal=INT 5m mutmut run "${patterns[@]}" || true
          git -C mutants init -q
          git -C mutants add -A
          # A budget below the job's timeout: a pull request that changes many functions still gets a report
          # of the mutants checked so far, instead of a cancelled job and no report at all.
          status=0
          timeout --signal=INT --kill-after=2m 30m mutmut run "${patterns[@]}" 2>&1 | tee run.log || status=$?
          if grep -q 'Filtered for specific mutants, but nothing matches' run.log; then
            # mutmut asserts when no pattern matches: the changed functions are ones it does not mutate.
            echo "The changed functions have no mutants: nothing to mutate." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          [ "$status" -eq 0 ] || [ "$status" -eq 124 ] || exit "$status"
          # The results also list every mutant not run (the other functions'), which would fill the summary.
          survivors=$(mktemp)
          mutmut results | grep -v ': not checked$' > "$survivors" || true
          checked=$(mutmut results --all true | grep -vc ': not checked$' || true)
          {
            echo '## Mutation testing of the changed functions'
            echo
            echo 'Mutants of: `'"${patterns[*]}"'`'
            echo
            if [ "$status" -eq 124 ]; then
              echo "Stopped after 30 minutes with $checked mutants checked: the results below cover those."
              echo
            fi
            if [ -s "$survivors" ]; then
              echo '```'
              cat "$survivors"
              echo '```'
            else
              echo 'no survivors'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
