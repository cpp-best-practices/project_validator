name: pages

# The documentation site: the README, docs/ and the generated support matrix, as HTML, built from main on every push
# and published to GitHub Pages, with the browser page (app/: the validator under Pyodide, on a folder the visitor
# picks, upstream #127) and the leaderboard from its nightly results (the `leaderboard-data` branch; the
# leaderboard workflow calls this one after each night). Each page says which commit it was built from.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - .github/workflows/pages.yml
      - .github/requirements/pages.txt
      - tests/build_site.py
      - leaderboard/**
      - web/**
  workflow_call:
  workflow_dispatch:

# One deployment at a time, and never cancelled: a cancelled deployment leaves the site in an unknown state.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install the site's dependencies
        run: python -m pip install --require-hashes -r .github/requirements/pages.txt

      # Before the first night there is no data branch: the leaderboard then lists its projects.
      - name: Fetch the leaderboard's results
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          git clone --quiet --depth 1 --branch leaderboard-data "https://github.com/${REPOSITORY}.git" \
            "${RUNNER_TEMP}/leaderboard" || mkdir -p "${RUNNER_TEMP}/leaderboard"

      - name: Build the site
        env:
          PYTHONPATH: ${{ github.workspace }}
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref_name }}
          REVISION: ${{ github.sha }}
        run: |
          python tests/build_site.py _site --repository "$REPOSITORY" --ref "$REF" --revision "$REVISION" \
            --leaderboard "${RUNNER_TEMP}/leaderboard"

      # The browser page and the validator's wheel, which it installs into Pyodide; built without isolation from the
      # hash-locked setuptools, as a release is.
      - name: Install the build tools
        run: python -m pip install --require-hashes -r .github/requirements/release.txt

      - name: Add the browser page
        run: |
          mkdir -p _site/app
          python -m build --no-isolation --wheel --outdir _site/app .
          cp web/* _site/app/
          find _site/app -maxdepth 1 -name '*.whl' -printf '%f\n' > _site/app/wheel.txt

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: deploy to GitHub Pages
    # A pull request only checks that the site builds.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
