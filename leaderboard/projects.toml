# The leaderboard: open-source projects scored every night with `--score` and published to GitHub Pages, one board
# per language (see leaderboard/README.md). Each entry names its GitHub `owner/repo`, the board it appears on
# (`language`: an ecosystem label of the support matrix) and its maintainers' `consent`: a link to their approval,
# or "seed" for the seed list until a maintainer confirms. Optional: `branch` (else the default branch),
# `auxiliary` and `exclude` (as the CLI takes them), and `license` when GitHub can not tell which it is.
#
# The seeds are one project per language, taken from the corpus (Compiler Explorer excepted): each stands for its
# ecosystem alone and has the fewest open validator issues against it. Sorted by language.

[[project]]
name = "serilog/serilog"
language = ".NET"
consent = "seed"

