# Which of each tool's diagnostics turn everything off (`blanket`) and which find bugs (`key`, globs), and what some
# of them guard against (`reasons`: a glob and the words a next step uses). A diagnostic a reason names finds bugs too.
# Any other diagnostic is a lint rule that finds no bugs, which costs a tool's strength nothing (see strength.toml).
#
# A table is a tool as the validator names it, whose settings a reader turns into what is turned off. Changing an
# entry changes the score: bump SCORE_VERSION in project_validator/score.py and say why in the changelog.

# clang-tidy: its bug-finding families, and the guidelines' checks against undefined behaviour. Each of those flags
# every use of a construct that can be undefined, not only the uses that are, so a project may turn one off on
# purpose; it still costs as a check that finds bugs, and the next step says what it guards against.
[clang-tidy]
blanket = ["*"]
key = ["bugprone-*", "cert-*", "clang-analyzer-*", "concurrency-*"]

[[clang-tidy.reasons]]
glob = "cppcoreguidelines-pro-bounds-*"
why = "it guards against undefined behaviour: reads and writes out of bounds"

[[clang-tidy.reasons]]
glob = "cppcoreguidelines-pro-type-reinterpret-cast"
why = "it guards against undefined behaviour: accesses that break the strict aliasing rule"

[[clang-tidy.reasons]]
glob = "cppcoreguidelines-pro-type-union-access"
why = "it guards against undefined behaviour: reads of a union's inactive member"

[[clang-tidy.reasons]]
glob = "hicpp-no-array-decay"
why = "it guards against undefined behaviour: arrays decayed to pointers, which lose their length and invite out-of-bounds access"

[[clang-tidy.reasons]]
glob = "hicpp-signed-bitwise"
why = "it guards against undefined behaviour: shifts of negative numbers or into the sign bit (undefined before C++20)"

# The C and C++ compilers' warnings that a `-Wno-` (or MSVC's `/wd`) turns off; `-w` turns off every one.
[compiler]
blanket = ["*"]
key = [
    "conversion", "sign-conversion", "float-conversion", "shadow*", "null-dereference", "format*",
    "implicit-fallthrough", "old-style-cast", "cast-*", "uninitialized", "maybe-uninitialized", "return-type",
    "array-bounds*", "stringop-*", "use-after-free*", "dangling*", "deprecated*", "overloaded-virtual",
]

# clippy's groups that find bugs, and the restriction lints against panics: not its pedantic lints (casts, docs).
[clippy]
key = [
    "correctness", "suspicious", "unwrap_used", "expect_used", "panic", "indexing_slicing",
    "undocumented_unsafe_blocks",
]

# Python's codes that find bugs: pyflakes' (undefined names), bugbear's, bandit's (each a letter and digits, or the
# letter alone for the whole plugin: not flynt's FLY, flake8-simplify's SIM, flake8-blind-except's BLE), and syntax
# errors.
[flake8]
key = ["F", "F[0-9]*", "B", "B[0-9]*", "S", "S[0-9]*", "E9*"]

[mypy]
blanket = ["ignore_errors"]
# Every error code mypy reports is a type error.
key = ["*"]

[pylint]
blanket = ["all"]
key = ["E*", "undefined-*", "used-before-assignment", "no-member", "dangerous-default-value"]

# ruff reimplements flake8's codes, and finds bugs with the same ones.
["ruff check"]
blanket = ["ALL"]
key_of = "flake8"

# The flags `strict` turns on, which tsconfig may turn off one by one: each lets bugs through.
[tsc]
key = ["*"]

# The tools below are named only for their inline suppressions (`eslint-disable`, `//nolint`, `rubocop:disable`): a
# comment that turns off only rules not listed here turns off lint rules that find no bugs, which costs nothing. A
# tool not named in this file finds bugs with every rule (cppcheck, Error Prone, PHPStan).

# eslint: its core rules of the "possible problems" kind, and the rules of the TypeScript, React hooks and security
# plugins that find bugs; not its suggestions (`no-console`, `max-len`, `prefer-const`) nor its layout rules.
[eslint]
key = [
    "array-callback-return", "constructor-super", "for-direction", "getter-return", "no-async-promise-executor",
    "no-await-in-loop", "no-class-assign", "no-compare-neg-zero", "no-cond-assign", "no-const-assign",
    "no-constant-binary-expression", "no-constant-condition", "no-constructor-return", "no-control-regex",
    "no-debugger", "no-dupe-*", "no-duplicate-*", "no-empty-character-class", "no-empty-pattern", "no-ex-assign",
    "no-fallthrough", "no-func-assign", "no-import-assign", "no-inner-declarations", "no-invalid-regexp",
    "no-irregular-whitespace", "no-loss-of-precision", "no-misleading-character-class",
    "no-new-native-nonconstructor", "no-obj-calls", "no-promise-executor-return", "no-prototype-builtins",
    "no-self-assign", "no-self-compare", "no-setter-return", "no-sparse-arrays", "no-template-curly-in-string",
    "no-this-before-super", "no-undef", "no-unexpected-multiline", "no-unmodified-loop-condition", "no-unreachable*",
    "no-unsafe-*", "no-unused-private-class-members", "no-unused-vars", "no-use-before-define",
    "no-useless-backreference", "require-atomic-updates", "use-isnan", "valid-typeof", "eqeqeq", "no-eval",
    "no-implied-eval", "no-new-func", "no-shadow",
    "@typescript-eslint/await-thenable", "@typescript-eslint/ban-ts-comment", "@typescript-eslint/no-explicit-any",
    "@typescript-eslint/no-floating-promises", "@typescript-eslint/no-misused-promises",
    "@typescript-eslint/no-non-null-assertion", "@typescript-eslint/no-shadow", "@typescript-eslint/no-unsafe-*",
    "@typescript-eslint/no-unused-vars", "@typescript-eslint/no-use-before-define", "@typescript-eslint/restrict-*",
    "@typescript-eslint/switch-exhaustiveness-check", "@typescript-eslint/no-unnecessary-condition",
    "react-hooks/*", "security/*",
]

# golangci-lint: the linters that find bugs (staticcheck's own codes too); not those of layout, length or naming
# (`lll`, `funlen`, `gofmt`, `revive`'s style rules).
[golangci-lint]
key = [
    "errcheck", "govet", "staticcheck", "SA*", "gosec", "G[0-9]*", "ineffassign", "unused", "typecheck", "bodyclose",
    "nilerr", "nilnil", "noctx", "rowserrcheck", "sqlclosecheck", "errorlint", "errchkjson", "exhaustive",
    "contextcheck", "durationcheck", "makezero", "copyloopvar", "exportloopref", "forcetypeassert", "asasalint",
    "bidichk", "musttag", "reassign", "spancheck",
]

# RuboCop: its Lint and Security departments; not Style, Layout, Naming or Metrics.
[RuboCop]
key = ["Lint/*", "Security/*"]
