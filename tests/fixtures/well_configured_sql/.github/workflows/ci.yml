jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shop
        ports: ["5432:5432"]
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - run: python -m pip install dbt-postgres sqlfluff sqlfluff-templater-dbt
      - run: dbt deps
      - run: sqlfluff lint models tests
      - run: npx --yes squawk-cli migrations/*.sql
      - run: dbt parse
      - run: dbt build --profiles-dir .
