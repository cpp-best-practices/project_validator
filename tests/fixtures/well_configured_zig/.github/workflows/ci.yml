on: [push, pull_request]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        zig: ["0.13.0", "0.14.1"]
        optimize: [Debug, ReleaseSafe]
        sanitize: ["", "-fsanitize-c"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ matrix.zig }}
      - run: zig fmt --check .
      - run: zig build -Doptimize=${{ matrix.optimize }} --summary all
      - run: zig test src/shop.zig -O ${{ matrix.optimize }} ${{ matrix.sanitize }}
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: "0.14.1"
      - run: sudo apt-get install -y kcov
      - run: zig test src/shop.zig --test-cmd kcov --test-cmd --include-pattern=src --test-cmd kcov-output --test-cmd-bin
