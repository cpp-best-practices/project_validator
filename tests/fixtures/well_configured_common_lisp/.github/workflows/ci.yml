on: [push, pull_request]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        lisp: [sbcl-bin, ccl-bin]
    env:
      LISP: ${{ matrix.lisp }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: 40ants/setup-lisp@011ae52ac776a259e128dab5eed5b18859ee0809 # v4.2.2
        with:
          asdf-system: shop
      - uses: 40ants/run-tests@663e2dc4907e1c46a3aa21a2e1cf7562e0a4db9d # v2.3.0
        with:
          asdf-system: shop
          run-tests: |
            (setf uiop:*compile-file-warnings-behaviour* :error)
            (asdf:test-system :shop)
          coveralls-token: ${{ secrets.GITHUB_TOKEN }}
  lint:
    runs-on: ubuntu-latest
    env:
      LISP: sbcl-bin
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: 40ants/setup-lisp@011ae52ac776a259e128dab5eed5b18859ee0809 # v4.2.2
      - run: ros install cxxxr/sblint
      - run: qlot exec sblint shop.asd
