jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --require-hashes -r requirements-dev.txt
      - run: bandit -c pyproject.toml -r src
      - run: pip-audit -r requirements-dev.txt
      - run: ruff format --check
      - run: ruff check
      - run: mypy src
      - run: lizard --length 30 --warnings_only .
      - run: python -W error -m coverage run -m pytest
