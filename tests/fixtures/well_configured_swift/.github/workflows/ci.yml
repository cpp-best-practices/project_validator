jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        swift: ["6.0", "6.1"]
        sanitizer: ["", "--sanitize=address"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: swift-actions/setup-swift@682457186b71c25a884c45c06f859febbe259240 # v2
        with:
          swift-version: ${{ matrix.swift }}
      - run: swift format lint --strict --recursive .
      - run: swiftlint --strict
      - run: swift build -Xswiftc -warnings-as-errors
      - run: swift test --enable-code-coverage ${{ matrix.sanitizer }}
      - run: swift test -c release ${{ matrix.sanitizer }}
      - run: osv-scanner scan --lockfile Package.resolved
      - run: muter
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: swift-actions/setup-swift@682457186b71c25a884c45c06f859febbe259240 # v2
        with:
          swift-version: "6.1"
      - run: swift build -Xswiftc -sanitize=fuzzer -Xswiftc -parse-as-library --product AppFuzz
      - run: .build/debug/AppFuzz -max_total_time=30
