on: [push, pull_request]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: shop
        uses: ./
        with:
          prices: "1 2 3"
      - shell: bash
        run: test "${{ steps.shop.outputs.total }}" = 6
