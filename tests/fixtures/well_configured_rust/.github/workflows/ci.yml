jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        toolchain: [stable, nightly]
        sanitizer: ["", "-Zsanitizer=address"]
    env:
      RUSTFLAGS: -D warnings ${{ matrix.sanitizer }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ matrix.toolchain }}
      - run: cargo fmt --check
      - run: cargo clippy --all-targets
      - run: cargo test
      - run: cargo audit
      - run: cargo test --release
      - run: cargo llvm-cov --branch --mcdc
      - run: git diff origin/main...HEAD > changes.diff
      - run: cargo mutants --in-diff changes.diff
      - run: cargo fuzz run parse -- -max_total_time=30
        if: matrix.toolchain == 'nightly'
