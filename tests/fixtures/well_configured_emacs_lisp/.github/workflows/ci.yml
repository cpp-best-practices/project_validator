on: [push, pull_request]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        emacs-version: ["29.4", "30.1", "snapshot"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: jcs090218/setup-emacs@ffd830bca5865932d99c3d179263d8b0ebdd00c0 # v3
        with:
          version: ${{ matrix.emacs-version }}
      - uses: emacs-eask/setup-eask@098ca9e1d90c188dbfee5c91688fbbaa930499b6 # v3
        with:
          version: snapshot
      - run: eask package
      - run: eask install
      - run: eask compile --strict
      - run: eask test ert test/*.el
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: jcs090218/setup-emacs@ffd830bca5865932d99c3d179263d8b0ebdd00c0 # v3
        with:
          version: "30.1"
      - uses: emacs-eask/setup-eask@098ca9e1d90c188dbfee5c91688fbbaa930499b6 # v3
        with:
          version: snapshot
      - run: eask lint package
      - run: eask lint checkdoc
