[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "project_validator"
version = "0.1.0"
description = "Validate a project's build, CI and tooling against best practices"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
# The console report: colour, tables and progress while the project is read.
pretty = ["rich>=13.0"]
# The TUI (--tui): browse the results and the facts in the terminal.
tui = ["rich>=13.0", "textual>=1.0"]
# Every optional view.
all = ["rich>=13.0", "textual>=1.0"]
coverage = ["coverage>=7.10"]

[project.scripts]
project-validator = "project_validator.cli:main"

[tool.setuptools.packages.find]
include = ["project_validator*"]

[tool.setuptools.package-data]
# The HTML report's stylesheet and scripts.
"project_validator.views" = ["assets/*"]

[tool.ruff]
line-length = 120
target-version = "py312"
# ruff reads notebooks; the bare Jupyter fixture's is broken on purpose.
extend-exclude = ["tests/fixtures/bare_jupyter"]

[tool.ruff.lint]
select = ["E", "W", "F", "FA", "I", "B", "BLE", "C4", "PIE", "RET", "S", "SIM", "UP", "RUF"]

[tool.ruff.lint.per-file-ignores]
# The fixtures are other projects' code, written as their authors would.
"tests/fixtures/**" = ["I002"]

[tool.ruff.lint.isort]
# Annotations are deferred everywhere (`from __future__ import annotations`), so forward references need no quotes
# on 3.12 and 3.13, which evaluate annotations eagerly.
required-imports = ["from __future__ import annotations"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["project_validator", "tests", "corpus", "leaderboard"]

[[tool.mypy.overrides]]
module = "atheris"
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["project_validator", "leaderboard"]
relative_files = true

[tool.coverage.report]
fail_under = 99
show_missing = true

[tool.pytest.ini_options]
# CI runs the unittest suite under pytest-xdist (`pytest -n auto`); `python -m unittest` runs the same tests.
# Collect only the unittest classes (pytest always collects those): not the helper functions named test/tested
# the test modules import, nor product classes named Test* (TestFiles), and not the fixture projects' own tests.
testpaths = ["tests"]
python_classes = ["__never__"]
python_functions = ["__never__"]
norecursedirs = [".*", "*.egg", "build", "dist", "venv", "fixtures"]

[tool.mutmut]
source_paths = ["project_validator/"]
pytest_add_cli_args_test_selection = ["tests/"]
# Keep pytest out of the fixtures' own tests and cache files, and stop it collecting the helper
# functions named test/tested that the test modules import (the unittest classes are still collected).
# The fresh-import architecture test is left out: mutmut maps every function that runs at import to it, yet it only
# fails on a mutant that breaks an import, so each of those mutants paid its 70 seconds and survived.
pytest_add_cli_args = [
    "--ignore-glob=*/fixtures/*",
    "-p",
    "no:cacheprovider",
    "-o",
    "python_functions=__never__",
    "--deselect",
    "tests/test_architecture.py::ArchitectureTests::test_every_module_imports_on_its_own",
    # A test that never ends (a mutant can make a loop stop progressing) fails alone instead of hanging the run.
    "--timeout=600",
]
# A change to pyproject.toml or the mutation requirements tests every mutant again. Not through git, which would count
# every changed file that is not Python (fixtures, snapshots): tests/mutation_cache.py resets the verdicts of the
# functions whose tests such a change affects, in the CI job's cache.
on_dependency_change = "rerun"
use_git_change_detection = false
cache_invalidation_files = [".github/requirements/mutation.txt"]
# The self-referential tests read these files from the repository root; tests/test_corpus.py imports corpus.
also_copy = [
    ".github/",
    ".gitignore",
    ".jscpd.json",
    "LICENSE.txt",
    "README.md",
    "SECURITY.md",
    "corpus/",
    "docs/",
    "leaderboard/",
]
