[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "project_validator"
version = "0.1.0"
description = "Validate a project's build, CI and tooling against best practices"
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
pretty = ["rich>=13.0"]
coverage = ["coverage>=7.10"]

[project.scripts]
project-validator = "project_validator.cli:main"

[tool.setuptools.packages.find]
include = ["project_validator*"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "BLE", "C4", "PIE", "RET", "S", "SIM", "UP", "RUF"]

[tool.mypy]
strict = true
files = ["project_validator", "tests"]

[tool.coverage.run]
branch = true
source = ["project_validator"]
relative_files = true

[tool.coverage.report]
fail_under = 99
show_missing = true
