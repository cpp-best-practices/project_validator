[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "project_validator"
version = "0.1.0"
description = "Validate a project's build, CI and tooling against best practices"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
pretty = ["rich>=13.0"]
coverage = ["coverage>=7.10"]

[project.scripts]
project-validator = "project_validator.cli:main"

[tool.setuptools.packages.find]
include = ["project_validator*"]

[tool.ruff]
line-length = 120
target-version = "py312"
# ruff reads notebooks; the bare Jupyter fixture's is broken on purpose.
extend-exclude = ["tests/fixtures/bare_jupyter"]

[tool.ruff.lint]
select = ["E", "W", "F", "FA", "I", "B", "BLE", "C4", "PIE", "RET", "S", "SIM", "UP", "RUF"]

[tool.ruff.lint.per-file-ignores]
# The fixtures are other projects' code, written as their authors would.
"tests/fixtures/**" = ["I002"]

[tool.ruff.lint.isort]
# Annotations are deferred everywhere (`from __future__ import annotations`), so forward references need no quotes
# on 3.12 and 3.13, which evaluate annotations eagerly.
required-imports = ["from __future__ import annotations"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["project_validator", "tests"]

[[tool.mypy.overrides]]
module = "atheris"
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["project_validator"]
relative_files = true

[tool.coverage.report]
fail_under = 99
show_missing = true

[tool.mutmut]
source_paths = ["project_validator/"]
pytest_add_cli_args_test_selection = ["tests/"]
# Keep pytest out of the fixtures' own tests and cache files, and stop it collecting the helper
# functions named test/tested that the test modules import (the unittest classes are still collected).
pytest_add_cli_args = ["--ignore-glob=*/fixtures/*", "-p", "no:cacheprovider", "-o", "python_functions=__never__"]
# The self-referential tests read these files from the repository root.
also_copy = [".github/", ".gitignore", ".jscpd.json", "LICENSE.txt", "README.md", "SECURITY.md", "docs/"]
