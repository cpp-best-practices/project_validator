<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>project_validator in your browser</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; margin: 0; color: #1f2328; background: #f6f8fa; }
  header { background: #fff; border-bottom: 1px solid #d0d7de; padding: 1.2rem 2rem; }
  header h1 { margin: 0 0 .3rem; font-size: 1.4rem; }
  main { padding: 1.2rem 2rem; }
  .choose { display: inline-block; background: #1f6feb; color: #fff; padding: .55rem 1.1rem; border-radius: 6px;
            cursor: pointer; font-weight: 600; }
  .choose input { display: none; }
  #status { margin: .8rem 0; color: #59636e; }
  #download { margin-left: 1rem; }
  #report { width: 100%; height: 80vh; border: 1px solid #d0d7de; border-radius: 6px; background: #fff; }
  @media (prefers-color-scheme: dark) {
    body { color: #e6edf3; background: #0d1117; } header, #report { background: #161b22; border-color: #30363d; }
    #status { color: #9198a1; }
  }
</style>
</head>
<body>
<header>
  <h1>project_validator in your browser</h1>
  <div>Pick a project's folder: the validator runs here, in your browser, and the folder never leaves your
    computer. The first run loads Python (about 13 MB); later runs reuse it.
    <a href="../">About project_validator</a></div>
</header>
<main>
  <label class="choose">Choose a folder…<input id="folder" type="file" webkitdirectory></label>
  <a id="download" download="project_validator-report.html" hidden>Download the report</a>
  <div id="status" role="status">No folder chosen yet.</div>
  <iframe id="report" title="The report" sandbox="allow-scripts" hidden></iframe>
</main>
<script src="app.js"></script>
</body>
</html>
